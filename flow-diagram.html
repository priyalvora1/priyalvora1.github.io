<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>CCM + RPM Enrollment Flow — Priyal Vora</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1420; --bar:#161d2c; --bar2:#1e2638; --line:#2a3447;
  --txt:#E9EDF4; --txt2:#95A2B6; --accent:#F0A94C; --stage:#FFFFFF;
  --font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--font);display:flex;flex-direction:column}

.bar{flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.bar .ttl{font-size:.88rem;font-weight:650;letter-spacing:-.01em}
.bar .sub{font-size:.74rem;color:var(--txt2)}
.spacer{flex:1 1 auto}
.ctrls{display:flex;align-items:center;gap:6px}
button{font-family:var(--font);background:var(--bar2);color:var(--txt);border:1px solid var(--line);
       border-radius:7px;padding:6px 11px;font-size:.78rem;font-weight:550;cursor:pointer;
       transition:background .13s,border-color .13s;white-space:nowrap}
button:hover{background:#27324a;border-color:#3a4760}
button:active{transform:translateY(1px)}
button.icon{padding:6px 10px;font-size:.92rem;line-height:1;min-width:34px}
.zoomval{font-size:.76rem;color:var(--txt2);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}

.stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--stage);
       cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
#pan{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#pan svg{display:block}

.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      background:rgba(15,20,32,.9);color:#dbe3ef;border:1px solid var(--line);
      border-radius:999px;padding:7px 15px;font-size:.75rem;pointer-events:none;
      transition:opacity .5s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.hint.gone{opacity:0}

.mini{position:absolute;right:12px;bottom:12px;background:rgba(15,20,32,.92);
      border:1px solid var(--line);border-radius:8px;padding:5px;pointer-events:none}
.mini svg{display:block;border-radius:3px;background:#fff}
.mini .vp{fill:rgba(240,169,76,.26);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
@media(max-width:620px){
  .mini{display:none}
  .bar .sub{display:none}
  .bar{gap:8px;padding:8px 11px}
}
</style>
</head>
<body>

<div class="bar">
  <div>
    <div class="ttl">CCM + RPM Enrollment Flow</div>
    <div class="sub">Scroll or drag to pan · ⌘/Ctrl + scroll or pinch to zoom</div>
  </div>
  <div class="spacer"></div>
  <div class="ctrls">
    <button class="icon" id="out" title="Zoom out (−)">−</button>
    <span class="zoomval" id="zv">100%</span>
    <button class="icon" id="in" title="Zoom in (+)">+</button>
    <button id="fit" title="Fit to screen (0)">Fit</button>
    <button id="full" title="Fullscreen (F)">Fullscreen</button>
  </div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage'),
        pan=document.getElementById('pan'),
        svg=pan.querySelector('svg'),
        zv=document.getElementById('zv'),
        hint=document.getElementById('hint'),
        mini=document.getElementById('mini');

  if(!svg){hint.textContent='Diagram failed to load.';return;}

  const W=parseFloat(svg.getAttribute('width'))||(svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||1000,
        H=parseFloat(svg.getAttribute('height'))||(svg.viewBox.baseVal&&svg.viewBox.baseVal.height)||1000;
  svg.setAttribute('width',W);svg.setAttribute('height',H);

  let scale=1,tx=0,ty=0,minS=.02;
  const maxS=14;

  // keep at least EDGE px of the diagram on screen at all times
  const EDGE=90;
  function clamp(){
    const r=stage.getBoundingClientRect(),cw=W*scale,ch=H*scale;
    tx=Math.min(r.width-EDGE,Math.max(EDGE-cw,tx));
    ty=Math.min(r.height-EDGE,Math.max(EDGE-ch,ty));
  }
  function apply(){
    clamp();
    pan.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    zv.textContent=Math.round(scale*100)+'%';
    drawMini();
  }
  function fit(){
    const r=stage.getBoundingClientRect(),pad=24;
    scale=Math.min((r.width-pad*2)/W,(r.height-pad*2)/H);
    minS=scale*.5;
    tx=(r.width-W*scale)/2; ty=(r.height-H*scale)/2;
    apply();
  }
  function zoomAt(cx,cy,f){
    const ns=Math.min(maxS,Math.max(minS,scale*f));
    if(ns===scale)return;
    tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale);
    scale=ns; apply();
  }

  stage.addEventListener('wheel',function(e){
    e.preventDefault();
    const r=stage.getBoundingClientRect();
    // trackpad pinch arrives as wheel with ctrlKey set
    if(e.ctrlKey||e.metaKey){
      zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);
      killHint();
      return;
    }
    // otherwise scroll pans, in both axes
    const k=e.deltaMode===1?16:(e.deltaMode===2?r.height:1);
    let dx=e.deltaX*k,dy=e.deltaY*k;
    if(e.shiftKey&&!dx){dx=dy;dy=0;}   // shift+wheel → horizontal
    tx-=dx; ty-=dy;
    apply();
    killHint();
  },{passive:false});

  let down=false,lx=0,ly=0;
  const pts=new Map();
  let pd=0;

  stage.addEventListener('pointerdown',function(e){
    pts.set(e.pointerId,e);
    if(pts.size===1){
      down=true;lx=e.clientX;ly=e.clientY;
      stage.classList.add('drag');
      try{stage.setPointerCapture(e.pointerId);}catch(_){}
    }
    killHint();
  });
  stage.addEventListener('pointermove',function(e){
    if(pts.has(e.pointerId))pts.set(e.pointerId,e);
    if(pts.size===2){
      down=false;
      const v=[...pts.values()],a=v[0],b=v[1],
            d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
            r=stage.getBoundingClientRect();
      if(pd)zoomAt((a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top,d/pd);
      pd=d;
      return;
    }
    if(!down)return;
    tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply();
  });
  function release(e){
    pts.delete(e.pointerId);
    if(pts.size<2)pd=0;
    if(pts.size===0){down=false;stage.classList.remove('drag');}
  }
  stage.addEventListener('pointerup',release);
  stage.addEventListener('pointercancel',release);

  stage.addEventListener('dblclick',function(e){
    const r=stage.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,1.9);
  });

  function ctr(){const r=stage.getBoundingClientRect();return[r.width/2,r.height/2];}
  document.getElementById('in').onclick=function(){const c=ctr();zoomAt(c[0],c[1],1.35);};
  document.getElementById('out').onclick=function(){const c=ctr();zoomAt(c[0],c[1],1/1.35);};
  document.getElementById('fit').onclick=fit;
  document.getElementById('full').onclick=function(){
    if(document.fullscreenElement){document.exitFullscreen();}
    else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}
  };

  addEventListener('keydown',function(e){
    if(e.key==='0'){fit();return;}
    if(e.key==='+'||e.key==='='){const c=ctr();zoomAt(c[0],c[1],1.35);return;}
    if(e.key==='-'||e.key==='_'){const c=ctr();zoomAt(c[0],c[1],1/1.35);return;}
    if(e.key==='f'||e.key==='F'){document.getElementById('full').click();return;}
    const step=e.shiftKey?220:70;
    if(e.key==='ArrowLeft'){tx+=step;apply();e.preventDefault();}
    if(e.key==='ArrowRight'){tx-=step;apply();e.preventDefault();}
    if(e.key==='ArrowUp'){ty+=step;apply();e.preventDefault();}
    if(e.key==='ArrowDown'){ty-=step;apply();e.preventDefault();}
  });

  const MW=168,MH=Math.max(26,Math.round(MW*H/W));
  mini.innerHTML='<svg width="'+MW+'" height="'+MH+'" viewBox="0 0 '+W+' '+H+'">'+
    '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#eef1f6"/>'+
    '<rect class="vp" id="vp" x="0" y="0" width="10" height="10"/></svg>';
  const vp=mini.querySelector('#vp');
  function drawMini(){
    if(!vp)return;
    const r=stage.getBoundingClientRect();
    vp.setAttribute('x',-tx/scale);
    vp.setAttribute('y',-ty/scale);
    vp.setAttribute('width',r.width/scale);
    vp.setAttribute('height',r.height/scale);
  }

  let ht=setTimeout(killHint,4200);
  function killHint(){hint.classList.add('gone');clearTimeout(ht);}

  // on resize, hold the point that was at the viewport centre
  let pw=0,ph=0;
  addEventListener('resize',function(){
    const r=stage.getBoundingClientRect();
    if(pw&&ph){
      tx+=(r.width-pw)/2;
      ty+=(r.height-ph)/2;
    }
    pw=r.width;ph=r.height;
    apply();
  });
  (function(){const r=stage.getBoundingClientRect();pw=r.width;ph=r.height;})();
  fit();
})();
</script>
</body>
</html>
