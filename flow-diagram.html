<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
background:linear-gradient(160deg,#f7f4fd,#fbf8f5 55%,#fdf3ec);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#221d3a}
.card{width:100%;max-width:400px;background:#fff;border:1px solid #eae4de;border-radius:22px;
padding:44px 38px;box-shadow:0 2px 4px rgba(34,29,58,.05),0 30px 60px -28px rgba(34,29,58,.3);text-align:center}
.mark{width:62px;height:62px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
background:conic-gradient(from 210deg,#efecfd,#e7f1f6,#fbeee3,#efecfd);
font-family:Fraunces,Georgia,serif;font-size:1.4rem;color:#4a3b78}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.42rem;margin:0 0 6px;letter-spacing:-.015em}
p.sub{color:#565073;font-size:.92rem;margin:0 0 26px;line-height:1.55}
input{width:100%;font:inherit;font-size:1rem;padding:13px 16px;border:1.5px solid #eae4de;
border-radius:11px;background:#fbf8f5;text-align:center;letter-spacing:.04em}
input:focus{outline:2px solid #6c5ce7;border-color:transparent;background:#fff}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:.95rem;padding:13px;
border:0;border-radius:999px;background:#6c5ce7;color:#fff;cursor:pointer;transition:.18s}
button:hover:not(:disabled){background:#5b4bd6}
button:disabled{background:#cdc7e4;cursor:progress}
.err{color:#c0492f;font-size:.87rem;margin-top:14px;min-height:20px}
.foot{margin-top:26px;font-size:.8rem;color:#8a85a3}
.foot a{color:#6c5ce7;text-decoration:none}
.foot a:hover{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .5s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
.shake{animation:sh .38s}@keyframes sh{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style></head><body>

<script>
(function(){
var P=JSON.parse(document.getElementById("d").textContent);
var KEY="pv-portfolio-key";
var f=document.getElementById("f"),pw=document.getElementById("pw"),
btn=document.getElementById("btn"),err=document.getElementById("err"),card=document.getElementById("card");
function bin(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open_(p){
var e=new TextEncoder();
var base=await crypto.subtle.importKey("raw",e.encode(p),"PBKDF2",false,["deriveKey"]);
var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bin(P.s),iterations:P.n,hash:"SHA-256"},
base,{name:"AES-GCM",length:256},false,["decrypt"]);
var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin(P.i)},k,bin(P.c));
return new TextDecoder().decode(pt);}
async function attempt(p,quiet){
if(!p)return false;
if(!quiet){btn.disabled=true;btn.textContent="Unlocking\u2026";err.textContent="";}
try{var html=await open_(p);
try{sessionStorage.setItem(KEY,p)}catch(e){}
document.open();document.write(html);document.close();return true;}
catch(e){
try{sessionStorage.removeItem(KEY)}catch(_){}
if(!quiet){btn.disabled=false;btn.textContent="Unlock";err.textContent="That password didn\u2019t work.";
card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");pw.select()}
return false;}}
f.addEventListener("submit",function(ev){ev.preventDefault();attempt(pw.value,false)});
if(!(window.crypto&&window.crypto.subtle)){err.textContent="This browser is too old to open the page.";btn.disabled=true}
else{var saved=null;try{saved=sessionStorage.getItem(KEY)}catch(e){}
if(saved){document.getElementById("card").style.visibility="hidden";
attempt(saved,true).then(function(ok){if(!ok)document.getElementById("card").style.visibility="visible"})}}
})();
</script></body></html>
